server {
    listen 80;
    server_name localhost;

    # ── Tier 1: serve static files ────────────────────────────────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Tier 2: reverse-proxy to the Python API ───────────────────────────────
    # /api/notes  →  http://api:5000/notes
    # /api/health →  http://api:5000/health
    #
    # The "api" hostname is resolved by Docker's internal DNS inside frontend-net.
    # nginx has NO route to backend-net: it can never talk directly to the DB.
    location /api/ {
        proxy_pass         http://api:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
